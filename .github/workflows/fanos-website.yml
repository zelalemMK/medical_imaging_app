name: FANOS website

on:
  push:
    paths:
      - 'fanos-website/**'
      - '.github/workflows/fanos-website.yml'
  pull_request:
    paths:
      - 'fanos-website/**'
      - '.github/workflows/fanos-website.yml'

jobs:
  test:
    name: Lint & unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: fanos-website
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: vendor/bin/phpunit
